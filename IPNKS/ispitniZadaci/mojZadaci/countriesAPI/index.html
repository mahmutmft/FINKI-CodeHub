<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .country-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .country-card {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            width: 250px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .country-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .flag {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 28px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .country-card {
                width: 100%;
            }
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>
<body>
<header>
    <h1>European Countries Dashboard</h1>
    <div class="controls">
        <button onclick="sortData('population')">Sort by Population</button>
        <button onclick="sortData('name')">Sort by Name</button>
    </div>
</header>

<div id="grid" class="country-grid"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modal-title"></h2>
        <div id="chart-container">
            <canvas id="myChart"></canvas>
        </div>
        <div id="country-info"></div>
    </div>
</div>

<script>
    let countriesData = [];
    let currentChart = null;

    async function fetchData() {
        try {
            const response = await fetch('https://restcountries.com/v3.1/region/europe');
            countriesData = await response.json();
            countriesData.sort((a, b) => b.population - a.population);
            renderGrid();
        } catch (error) {
            console.error('Error fetching data:', error);
            alert('Failed to load data. Please try again later.');
        }
    }

    function sortData(criteria) {
        countriesData.sort((a, b) => {
            if (criteria === 'population') return b.population - a.population;
            if (criteria === 'name') return a.name.common.localeCompare(b.name.common);
            return 0;
        });
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        countriesData.forEach(country => {
            const card = document.createElement('div');
            card.className = 'country-card';
            card.innerHTML = `
            <img src="${country.flags.png}" alt="${country.name.common} Flag" class="flag">
            <h3>${country.name.common}</h3>
            <p>Population: ${country.population.toLocaleString()}</p>
        `;
            card.addEventListener('click', () => showModal(country));
            grid.appendChild(card);
        });
    }

    function showModal(country) {
        const modal = document.getElementById('modal');
        const info = document.getElementById('country-info');

        document.getElementById('modal-title').textContent = country.name.common;
        info.innerHTML = `
        <p>Capital: ${country.capital?.[0] || 'N/A'}</p>
        <p>Area: ${country.area.toLocaleString()} km²</p>
        <p>Population: ${country.population.toLocaleString()}</p>
    `;

        if (currentChart) currentChart.destroy();
        renderChart(country);

        modal.style.display = 'block';
        document.querySelector('.close').addEventListener('click', () => {
            modal.style.display = 'none';
        });
    }

    function renderChart(country) {
        const ctx = document.getElementById('myChart').getContext('2d');
        currentChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Population', 'Area'],
                datasets: [{
                    label: country.name.common,
                    data: [country.population, country.area],
                    backgroundColor: ['#36a2eb', '#ff6384']
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    }

    window.onload = fetchData;
    window.onclick = (event) => {
        if (event.target === document.getElementById('modal')) {
            document.getElementById('modal').style.display = 'none';
        }
    };
</script>
</body>
</html>
